name: Update Catalyst Calendar

# 2026-11-20 자동 실행 끔 — 경제 일정은 Daily UptoDate 경제 일정(Signal data/calendar.json, 오늘~10일)
# 하나로 합쳤다. 대시보드·포털 모두 그쪽을 읽는다. 지우지 않고 수동 실행만 남겨 둔다.
on:
  workflow_dispatch:

jobs:
  update-catalysts:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install "anthropic>=1.15,<2" pytz

      - name: Run update script
        # 2026-11-20 Gemini → Claude. 저장소 Settings → Secrets 의 ANTHROPIC_API_KEY 필요
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/update_catalysts.py

      - name: Commit and push changes
        # 수집이 실패해도 '지난 일정 정리'는 올린다 (스크립트가 실패 코드를 내도 이 단계는 돈다)
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          if git diff --quiet catalysts.json; then
            echo "No changes to commit"
          else
            git add catalysts.json
            git commit -m "📅 Update catalysts $(TZ='Asia/Seoul' date +'%Y-%m-%d %H:%M KST')"
            git pull --rebase origin main
            git push
          fi
