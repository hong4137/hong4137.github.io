# 2026-11-20 스포츠 보강(Serper → Claude 웹 검색) 시험 — 버튼으로만 실행, 데이터 파일은 바꾸지 않는다
name: "(시험) 스포츠 Claude 웹 검색"

on: workflow_dispatch

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pytz "anthropic>=1.15,<2"
      - name: 세 기능 한 번씩 불러 보기
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/test_web_search.py
