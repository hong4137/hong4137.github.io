# 2026-11-20 Gemini 를 더 이상 쓰지 않는다(스포츠·경제 일정 모두 Claude/UptoDate 로 옮김). 지우지 않고 수동 실행만 남김
name: "(옛) Test Gemini API"

on: workflow_dispatch  # 버튼 눌러서 수동 실행

jobs:
  test-connection:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install libraries
        run: pip install google-genai
        
      - name: Run Test Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/test_gemini.py
